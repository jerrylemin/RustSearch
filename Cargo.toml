[package]
name = "rustsearch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A compact Windows browser inspired by Search"

[dependencies]
accesskit = { version = "=0.25.2", features = ["serde"] }
accesskit_windows = "=0.35.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.3"
url = "2"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

servo = { version = "=0.8.0", default-features = false, features = ["bundled", "clipboard", "js_jit"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
euclid = "0.22"
http = "1"
raw-window-handle = "0.6"
